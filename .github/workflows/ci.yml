# Verifies PRs and exact main revisions; successful main checks deliver to dev.
# Calls the shared CI/CD workflows; production uses deploy-production.yml.
name: CI
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
      refresh_dev:
        description: Explicitly refresh shared dev data after delivery
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: Verify
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@64b5e00a3d2895a8cba05b040f0d5a0415613d9e
    with:
      automation_sha: 64b5e00a3d2895a8cba05b040f0d5a0415613d9e
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '22'
  deploy_dev:
    name: Deploy dev
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@64b5e00a3d2895a8cba05b040f0d5a0415613d9e
    with:
      automation_sha: 64b5e00a3d2895a8cba05b040f0d5a0415613d9e
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '22'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
  verify_result:
    name: Verify
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
