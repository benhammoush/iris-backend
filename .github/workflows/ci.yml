# Generated by the pinned ci-cd-workflows template renderer.
name: CI
on:
  pull_request: null
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
      refresh_dev:
        description: Explicitly refresh shared dev data after delivery
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  verify:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@1d4b201fc53f05c53de2fdc37ab9b184b676a1be
    with:
      automation_sha: 1d4b201fc53f05c53de2fdc37ab9b184b676a1be
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '22'
  deploy_dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@1d4b201fc53f05c53de2fdc37ab9b184b676a1be
    with:
      automation_sha: 1d4b201fc53f05c53de2fdc37ab9b184b676a1be
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '22'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
  legacy_0:
    name: test
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
