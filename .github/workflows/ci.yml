name: Iris Worker API — CI & Deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        options: [dev, production]
        default: dev
      sha:
        description: Exact merged commit to redeploy in dev or promote after dev acceptance
        required: true
      refresh_dev:
        description: Explicitly refresh shared dev data
        type: boolean
        default: false

permissions:
  contents: read

env:
  SOURCE_SHA: ${{ inputs.sha || github.sha }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate manual release
        if: github.event_name == 'workflow_dispatch'
        env:
          TARGET: ${{ inputs.target || 'dev' }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          case "$TARGET" in
            dev|production) ;;
            *) echo "::error::Choose dev or production"; exit 1 ;;
          esac
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ "$TARGET" = production ]; then
            test "$GITHUB_RUN_ATTEMPT" = 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - name: Require a merged release commit
        if: github.event_name == 'workflow_dispatch'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:tooling
      - run: npm run audit:dependencies
      - run: npm run check:versions
      - run: npm run check:types
      - run: npm run lint:openapi
      - run: npm test
      - run: npm run check

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: ${{ inputs.target || 'dev' }}
    concurrency:
      group: iris-worker-${{ inputs.target || 'dev' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate configuration, deploy, and check API
        env:
          TARGET: ${{ inputs.target || 'dev' }}
          REFRESH_DEV: ${{ inputs.refresh_dev || false }}
          DEPLOY_ENABLED: ${{ vars.DEPLOY_ENABLED }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IRIS_WORKER_ORIGIN: ${{ vars.IRIS_WORKER_ORIGIN }}
          IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
        run: |
          test "$DEPLOY_ENABLED" = true || { echo "::error::Complete the environment runbook before enabling deployment"; exit 1; }
          if [ "$TARGET" = production ]; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_RUN_ATTEMPT" = 1
          fi
          test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"
          [[ "$IRIS_WORKER_ORIGIN" =~ ^https://[A-Za-z0-9.-]+$ ]] || exit 1
          kv_id=$(awk -v section="[[env.${TARGET}.kv_namespaces]]" '$0 == section { found=1; next } found && /^\[/ { exit } found && /^id =/ { gsub(/"/, "", $3); print $3; exit }' wrangler.toml)
          [[ "$kv_id" =~ ^[0-9a-f]{32}$ && "$kv_id" != 00000000000000000000000000000000 ]] || { echo "::error::Configure a real isolated KV namespace in wrangler.toml"; exit 1; }
          if [ "$TARGET" != dev ] || [ "$REFRESH_DEV" = true ]; then
            test -n "$IRIS_REFRESH_TOKEN"
          fi
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$SOURCE_SHA" || { echo "::error::A newer main commit supersedes this dev deployment"; exit 1; }
          fi
          npx wrangler deploy --env "$TARGET"
          printf 'Worker commit: `%s`\n\nEnvironment: %s\n' "$SOURCE_SHA" "$TARGET" >> "$GITHUB_STEP_SUMMARY"
          if [ "$TARGET" != dev ] || [ "$REFRESH_DEV" = true ]; then
            curl --fail --show-error --max-time 120 \
              -H "Authorization: Bearer $IRIS_REFRESH_TOKEN" \
              -X POST "$IRIS_WORKER_ORIGIN/internal/refresh"
          fi
          curl --fail --show-error --max-time 30 "$IRIS_WORKER_ORIGIN/health"
          curl --fail --show-error --max-time 30 "$IRIS_WORKER_ORIGIN/ready"
