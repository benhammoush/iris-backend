# Generated by the pinned ci-cd-workflows template renderer.
# Shared toolchain: v1.0.1; the Worker profile still skips browser installation.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits workflow structure without comments. The frontend ENVIRONMENTS.md owns
# the paired release runbook; backend package.json/scripts own executable checks.
name: CI
on:
  # Shared: PRs verify only; native checks/current-head approval gate human merge.
  pull_request: null
  # Shared: recheck the exact merged main commit before automatic dev delivery.
  push:
    branches:
      - main
  # Shared: exact merged-SHA dev revalidation/recovery, never production selection.
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA to revalidate and redeploy in dev
        type: string
        required: true
      # Project: opt in to ONE authenticated dev snapshot refresh after delivery.
      # Automatic pushes do not refresh; this input does not enable an environment.
      refresh_dev:
        description: Explicitly refresh shared dev data after delivery
        type: boolean
        default: false
# Shared: read source/Actions evidence, with no merge or administration writes.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: pinned Worker verification invokes ci:quality and ci:prepare, then
  # retains the checked bundle/configuration identity for deployment.
  # Project: ci:quality runs the complete npm check gate: lint/format/tooling,
  # audits, version/types/OpenAPI validation, API/runtime and merge-policy tests,
  # then a dry-run build. No browser suite is added merely for backend symmetry.
  # Project: ci:prepare produces the prebundled Worker used by the release job.
  verify:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      # Shared: checkout and reusable workflow must use the same immutable pin.
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      # Shared: explicit dispatch SHA or exact PR/main event revision.
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      # Project: preserve the Worker's supported toolchain, independent of frontend.
      node_version: '22'
  # Shared: only successful main push/manual dev verification can deliver dev.
  # The called job binds dev, checks artifact integrity/freshness without an opt-in and
  # serializes target mutations without cancelling active delivery.
  # Project: scripts/ci-deploy.mjs enforces isolated KV/origins/preview policy,
  # deploys the checked bundle, honors explicit refresh_dev and checks health/ready.
  # Production refresh/Cron policy belongs to the separate approved release path.
  deploy_dev:
    needs: verify
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@d7d0c297f0b4038e9815349fd16f79bb92d77ceb
    with:
      automation_sha: d7d0c297f0b4038e9815349fd16f79bb92d77ceb
      source_sha: ${{ inputs.sha || github.sha }}
      environment: dev
      node_version: '22'
    # Shared: named provider secrets reach deployment, never candidate verification.
    # Project: IRIS_REFRESH_TOKEN is required only for an explicitly requested dev
    # refresh here; runtime provider API keys remain Worker-managed secrets.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
  # Project: preserve the existing required check named test.
  # Shared: always report verify's outcome; this bridge does not repeat API tests.
  legacy_0:
    name: test
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
