# Verifies pull requests without deployment jobs or credentials.
# The standalone Verify result preserves the existing required-check context.
name: Verify PR
on:
  pull_request: null
permissions:
  contents: read
  actions: read
jobs:
  verify:
    name: PR checks
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@43018f3d7ec3605d14379be6f1f5de287ad6a1f1
    with:
      automation_sha: 43018f3d7ec3605d14379be6f1f5de287ad6a1f1
      source_sha: ${{ github.sha }}
      environment: dev
      node_version: '22'
  verify_result:
    name: Verify
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful PR checks
        run: test "$VERIFY_RESULT" = success
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
