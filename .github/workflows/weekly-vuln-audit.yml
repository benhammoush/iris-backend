# Runs weekly/manual vulnerability checks using pinned shared CI/CD logic.
# Calls the shared vulnerability audit weekly or manually; no fixes or deployment.
name: Weekly vulnerability audit
on:
  schedule:
    - cron: '43 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-vuln-audit
  cancel-in-progress: false
jobs:
  audit:
    name: Audit vulnerabilities
    uses: benhammoush/ci-cd-workflows/.github/workflows/weekly-vuln-audit.yml@d1143395dc6a078ef284978c1daf039ed06ff7d1
    with:
      node_version: '22'
