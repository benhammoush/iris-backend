# Generated by the pinned ci-cd-workflows template renderer.
# Shared toolchain: v1.0.1; the Worker profile still skips browser installation.
# Project-owned annotations: preserve these when regenerating; the v1 renderer
# emits structure without comments. The frontend ENVIRONMENTS.md owns paired release
# acceptance/recovery; this repository owns Worker configuration and API checks.
name: Deploy production
on:
  # Shared: production is manual from main, never an automatic consequence of merge.
  # Project: promote the compatible Worker first when frontend/backend both change.
  workflow_dispatch:
    inputs:
      # Shared: full merged WORKER SHA with retained successful dev-delivery evidence.
      # The compatible frontend has its own SHA; no cross-repository latest guessing.
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
# Shared: read source ancestry and retained Actions evidence; no merge/admin writes.
permissions:
  contents: read
  actions: read
jobs:
  # Shared: reject missing/mismatched dev evidence before candidate verification.
  # Project: ci:quality runs the full API/runtime/schema/policy/audit/build gate;
  # ci:prepare supplies the checked prebundled Worker, not a frontend/browser suite.
  # Shared: these candidate checks have no production deployment/refresh credentials.
  # Production-selected artifact/configuration identity is retained for the deploy job.
  verify_release:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@37151e604a66c0dbb68b5631534c7124d4d95798
    with:
      # Shared: reusable workflow and implementation checkout have one immutable pin.
      automation_sha: 37151e604a66c0dbb68b5631534c7124d4d95798
      source_sha: ${{ inputs.sha }}
      # Shared: explicit production target, never a free-form environment selector.
      environment: production
      node_version: '22'
  # Shared: the called job binds production after verification and waits for native
  # owner approval; main-only/reviewer/no-admin-bypass rules live in GitHub settings.
  # After approval it rechecks dev evidence/artifact identity, honors enablement and
  # serializes target mutations. No candidate rebuild substitutes for checked bytes.
  # Project: ci-deploy.mjs enforces isolated production KV, CORS, preview and Cron
  # policy, then deploys the Worker and performs ONE authenticated release refresh
  # before health/readiness smoke. Automatic dev pushes do not share that refresh.
  # Runtime provider API keys remain Worker secrets; native approval must consider
  # refresh/Cron effects and compatible frontend/recovery evidence, not just CI.
  # Failed/uncertain releases need investigation and fresh dispatch/approval;
  # no blind refresh retry, production job rerun, automatic rollback or KV reversal.
  deploy_production:
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@37151e604a66c0dbb68b5631534c7124d4d95798
    with:
      automation_sha: 37151e604a66c0dbb68b5631534c7124d4d95798
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '22'
    # Shared: selected production credentials only; never a dev token or extra PAT.
    # Project: the refresh credential must match this Worker's REFRESH_TOKEN.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
