# Manually verifies and releases an exact dev-accepted source revision to production.
# Calls shared CI/CD workflows with native environment approval.
name: Deploy production
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify_release:
    name: Verify production
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@64b5e00a3d2895a8cba05b040f0d5a0415613d9e
    with:
      automation_sha: 64b5e00a3d2895a8cba05b040f0d5a0415613d9e
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '22'
  deploy_production:
    name: Deploy production
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@64b5e00a3d2895a8cba05b040f0d5a0415613d9e
    with:
      automation_sha: 64b5e00a3d2895a8cba05b040f0d5a0415613d9e
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '22'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
