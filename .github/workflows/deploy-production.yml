name: Deploy production
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact merged source SHA already delivered and accepted in dev
        type: string
        required: true
permissions:
  contents: read
  actions: read
jobs:
  verify_release:
    uses: benhammoush/ci-cd-workflows/.github/workflows/verify-worker.yml@1d4b201fc53f05c53de2fdc37ab9b184b676a1be
    with:
      automation_sha: 1d4b201fc53f05c53de2fdc37ab9b184b676a1be
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '22'
  deploy_production:
    needs: verify_release
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: benhammoush/ci-cd-workflows/.github/workflows/deploy-worker.yml@1d4b201fc53f05c53de2fdc37ab9b184b676a1be
    with:
      automation_sha: 1d4b201fc53f05c53de2fdc37ab9b184b676a1be
      source_sha: ${{ inputs.sha }}
      environment: production
      node_version: '22'
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      IRIS_REFRESH_TOKEN: ${{ secrets.IRIS_REFRESH_TOKEN }}
