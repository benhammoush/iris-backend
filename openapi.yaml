                finalizedSlot: { type: [number, 'null'] }
                blockHeight: { type: [number, 'null'] }
                blockTime: { type: [number, 'null'] }
                transactionCount: { type: integer }
                failedTransactions: { type: [integer, 'null'] }
                failurePct: { type: [number, 'null'] }
