              properties:
                totalSol: { type: [number, 'null'] }
                circulatingSol: { type: [number, 'null'] }
                nonCirculatingSol: { type: [number, 'null'] }
                inflationTotalPct: { type: [number, 'null'] }
                inflationValidatorPct: { type: [number, 'null'] }
                inflationFoundationPct: { type: [number, 'null'] }
                inflationEpoch: { type: [number, 'null'] }
                inflationGovernor:
                  { type: [object, 'null'], additionalProperties: true }
        reliability:
