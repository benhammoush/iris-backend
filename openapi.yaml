                slotsInEpoch: { type: [number, 'null'] }
                epochProgressPct: { type: [number, 'null'] }
        performance:
          allOf:
            - { $ref: '#/components/schemas/NetworkGroup' }
            - type: object
              properties:
                tps: { type: [number, 'null'] }
                nonVoteTps: { type: [number, 'null'] }
                sampleCount: { type: integer }
                samplePeriodSecs: { type: number }
                transactions: { type: number }
                nonVoteTransactions: { type: [number, 'null'] }
        fees:
          allOf:
            - { $ref: '#/components/schemas/NetworkGroup' }
            - type: object
              properties:
                averageFeeLamports: { type: [number, 'null'] }
                feeSampleCount: { type: integer }
                medianPriorityFeeMicroLamports: { type: [number, 'null'] }
                priorityFeeSampleCount: { type: integer }
