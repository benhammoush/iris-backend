              properties:
                assignedLeaderSlots: { type: number }
                blocksProduced: { type: number }
                missedLeaderSlots: { type: number }
                productionPct: { type: [number, 'null'] }
                range: { type: [object, 'null'], additionalProperties: true }
        validators:
          allOf:
            - { $ref: '#/components/schemas/NetworkGroup' }
            - type: object
              properties:
                currentVoteAccounts: { type: integer }
                delinquentVoteAccounts: { type: integer }
        economics:
          allOf:
            - { $ref: '#/components/schemas/NetworkGroup' }
