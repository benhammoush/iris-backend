name = "iris-backend"
main = "src/index.ts"
compatibility_date = "2026-10-02"

[observability.logs]
enabled = true
invocation_logs = true

[vars]
CORS_ORIGINS = ""

[[kv_namespaces]]
binding = "SNAPSHOTS"
# Unconfigured bootstrap: never bind the old hosted storage by default.
id = "00000000000000000000000000000000"

# Local-only: npm run dev explicitly disables remote access.
[env.local]
name = "iris-backend-local"

[env.local.vars]
CORS_ORIGINS = "http://localhost:5173,http://127.0.0.1:5173"

[[env.local.kv_namespaces]]
binding = "SNAPSHOTS"
id = "00000000000000000000000000000000"

[env.dev]
name = "iris-backend-dev"
workers_dev = true
preview_urls = false

[env.dev.vars]
CORS_ORIGINS = "https://iris-frontend-dev.vercel.app,http://localhost:5173"

[[env.dev.kv_namespaces]]
binding = "SNAPSHOTS"
# Isolated namespace provisioned for the new dev Worker.
id = "5bedf23d861c4e5d8a72afc9305bbf46"

[env.e2e]
name = "iris-backend-e2e"

[env.e2e.vars]
CORS_ORIGINS = "http://127.0.0.1:4173"
PROVIDER_MODE = "cache-only"

[[env.e2e.kv_namespaces]]
binding = "SNAPSHOTS"
id = "00000000000000000000000000000000"

[env.production]
name = "iris-backend-production"
workers_dev = true
preview_urls = false

[env.production.vars]
CORS_ORIGINS = "https://iris-frontend-production.vercel.app"

[[env.production.kv_namespaces]]
binding = "SNAPSHOTS"
# Isolated namespace provisioned for the new production Worker.
id = "4442b6231710407ea3a668dc9a8a8794"

[env.production.triggers]
crons = ["0 * * * *"]
